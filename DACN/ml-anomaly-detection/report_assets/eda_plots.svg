<text x="32" y="82" fill="#d1d5db" font-family="Consolas, monospace" font-size="18">def trend_figure(frame, value_col, timestamp_col="timestamp"):</text>
<text x="32" y="116" fill="#d1d5db" font-family="Consolas, monospace" font-size="18">    data = add_time_features(frame, timestamp_col)</text>
