<text x="32" y="82" fill="#d1d5db" font-family="Consolas, monospace" font-size="18">timestamps = pd.to_datetime(result[timestamp_col])</text>
<text x="32" y="116" fill="#d1d5db" font-family="Consolas, monospace" font-size="18">result["hour"] = timestamps.dt.hour</text>
<text x="32" y="150" fill="#d1d5db" font-family="Consolas, monospace" font-size="18">result["day_of_week"] = timestamps.dt.dayofweek</text>
<text x="32" y="184" fill="#d1d5db" font-family="Consolas, monospace" font-size="18">result["is_weekend"] = (result["day_of_week"] &gt;= 5).astype(int)</text>
<text x="32" y="218" fill="#d1d5db" font-family="Consolas, monospace" font-size="18">result["hour_sin"] = np.sin(2 * np.pi * result["hour"] / 24)</text>
<text x="32" y="252" fill="#d1d5db" font-family="Consolas, monospace" font-size="18">result["hour_cos"] = np.cos(2 * np.pi * result["hour"] / 24)</text>
<text x="32" y="286" fill="#d1d5db" font-family="Consolas, monospace" font-size="18">result["dow_sin"] = np.sin(2 * np.pi * result["day_of_week"] / 7)</text>
<text x="32" y="320" fill="#d1d5db" font-family="Consolas, monospace" font-size="18">result["dow_cos"] = np.cos(2 * np.pi * result["day_of_week"] / 7)</text>
