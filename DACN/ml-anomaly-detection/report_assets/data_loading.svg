<text x="32" y="82" fill="#d1d5db" font-family="Consolas, monospace" font-size="18">def load_timeseries(source, timestamp_col="timestamp", value_col=None):</text>
<text x="32" y="116" fill="#d1d5db" font-family="Consolas, monospace" font-size="18">    frame = pd.read_csv(source)</text>
<text x="32" y="150" fill="#d1d5db" font-family="Consolas, monospace" font-size="18">    frame[timestamp_col] = pd.to_datetime(</text>
<text x="32" y="184" fill="#d1d5db" font-family="Consolas, monospace" font-size="18">        frame[timestamp_col], errors="coerce")</text>
<text x="32" y="218" fill="#d1d5db" font-family="Consolas, monospace" font-size="18">    if value_col is None:</text>
<text x="32" y="252" fill="#d1d5db" font-family="Consolas, monospace" font-size="18">        numeric = [c for c in frame.columns</text>
<text x="32" y="286" fill="#d1d5db" font-family="Consolas, monospace" font-size="18">                   if pd.api.types.is_numeric_dtype(frame[c])]</text>
<text x="32" y="320" fill="#d1d5db" font-family="Consolas, monospace" font-size="18">        value_col = numeric[0]</text>
<text x="32" y="354" fill="#d1d5db" font-family="Consolas, monospace" font-size="18">    frame[value_col] = pd.to_numeric(</text>
<text x="32" y="388" fill="#d1d5db" font-family="Consolas, monospace" font-size="18">        frame[value_col], errors="coerce")</text>
<text x="32" y="422" fill="#d1d5db" font-family="Consolas, monospace" font-size="18">    return frame.dropna().sort_values(timestamp_col)</text>
</svg>